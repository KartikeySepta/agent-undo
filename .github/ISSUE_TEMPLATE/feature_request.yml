name: Feature request
description: Something agent-undo should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong today?
      description: The situation where you wanted this, not the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
  - type: dropdown
    id: agent
    attributes:
      label: Which agent do you use?
      multiple: true
      options: [Claude Code, Codex, Cursor, Gemini CLI, OpenCode, Other MCP client, CLI only]
