name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises clonefile (APFS); Ubuntu (ext4) exercises the reflink→copy fallback.
        os: [macos-latest, ubuntu-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Committed bundles match source
        run: node scripts/check-bundles.js
      - name: Test
        run: |
          npm run build
          node --test --test-reporter=spec --test-reporter-destination=stdout \
               --test-reporter=tap --test-reporter-destination=tap.txt tests/*.test.js
      - name: Annotate failures
        if: failure()
        # Surface each failing test as a GitHub annotation (visible on the PR/commit without opening logs).
        run: |
          node -e '
            const t = require("fs").readFileSync("tap.txt", "utf8").split("\n");
            t.forEach((l, i) => {
              const m = l.match(/^\s*not ok \d+ - (.*)/);
              if (!m) return;
              const body = t.slice(i + 1, i + 25).join("\n").replace(/%/g, "%25").replace(/\r?\n/g, "%0A");
              console.log(`::error title=${m[1]}::${body}`);
            });'
      - name: Doctor
        run: node bin/agent-undo.cjs doctor || true

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Manifests parse
        run: |
          node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/claude-hooks.json','hooks/cursor-hooks.json','.codex-plugin/plugin.json','.codex-plugin/hooks.json','.codex-plugin/mcp.json','.agents/plugins/marketplace.json','.cursor/mcp.json','gemini-extension.json','opencode.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Versions agree
        run: node scripts/check-versions.js
      - name: Rule copies match src/instructions.ts
        run: node scripts/check-rule-copies.js
